name: Tool Toán Auto Release
run-name: Tool Toán (Build #${{ github.run_number }})

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  determine-version:
    name: Determine Release Version
    runs-on: ubuntu-latest
    outputs:
      version_num: ${{ steps.app_version.outputs.version_num }}
      version_tag: ${{ steps.app_version.outputs.version_tag }}
      release_title: ${{ steps.app_version.outputs.release_title }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine next app version
        id: app_version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAX_V=0

          ALL_TAGS="$(git tag -l || true)"
          if command -v gh >/dev/null 2>&1; then
            REL_TAGS="$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null || true)"
            ALL_TAGS="$(printf '%s\n%s\n' "${ALL_TAGS}" "${REL_TAGS}")"
          fi

          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            num=""
            if [[ "${tag}" =~ ^v([0-9]+)$ ]]; then
              num="${BASH_REMATCH[1]}"
            elif [[ "${tag}" =~ ^tool-toan-v([0-9]+) ]]; then
              num="${BASH_REMATCH[1]}"
            fi
            if [ -n "${num}" ]; then
              num_dec=$((10#${num}))
              if [ "${num_dec}" -gt "${MAX_V}" ]; then
                MAX_V="${num_dec}"
              fi
            fi
          done <<< "${ALL_TAGS}"

          NEXT_V=$((MAX_V + 1))
          VERSION_TAG="v${NEXT_V}"
          RELEASE_TITLE="Tool Toán ${VERSION_TAG}"

          echo "Detected max existing version: v${MAX_V}"
          echo "Next release version: ${RELEASE_TITLE} (versionCode=${NEXT_V}, tag=${VERSION_TAG})"

          echo "version_num=${NEXT_V}" >> "${GITHUB_OUTPUT}"
          echo "version_tag=${VERSION_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"

  build-android-apk:
    name: Build Android APK
    needs: determine-version
    runs-on: ubuntu-latest
    outputs:
      asset_name: ${{ steps.prepare_release_asset.outputs.asset_name }}
      sha1: ${{ steps.keystore.outputs.sha1 }}
      sha256: ${{ steps.keystore.outputs.sha256 }}
      firebase_sha1_status: ${{ steps.firebase_cfg.outputs.sha1_status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java_ver_output="$(java -version 2>&1)"
          echo "${java_ver_output}"

          version_string="$(printf '%s\n' "${java_ver_output}" | awk -F'"' '/version "/ { print $2; exit }')"
          if [ -z "${version_string}" ]; then
            echo "::error::Unable to detect the active Java version from 'java -version'."
            exit 1
          fi

          if [[ "${version_string}" == 1.* ]]; then
            major_version="$(printf '%s' "${version_string}" | cut -d. -f2)"
          else
            major_version="$(printf '%s' "${version_string}" | cut -d. -f1 | sed 's/[^0-9].*$//')"
          fi

          if ! [[ "${major_version}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse active Java major version from '${version_string}'."
            exit 1
          fi

          echo "Detected Java major version: ${major_version}"
          if [ "${major_version}" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${major_version}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore cached debug keystore (fallback)
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: tool-toan-debug-keystore-v1

      - name: Restore or initialize persistent debug keystore
        id: keystore
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SECRET_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          KEYSTORE_B64_FILE="./debug.keystore.base64"
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          CREATED_NEW_KEYSTORE="false"

          if [ ! -x "${KEYTOOL_BIN}" ]; then
            echo "::error::keytool was not found at ${KEYTOOL_BIN}."
            exit 1
          fi

          is_valid_keystore() {
            [ -f "$1" ] && [ -s "$1" ] && "${KEYTOOL_BIN}" -list -keystore "$1" -storepass android -alias androiddebugkey >/dev/null 2>&1
          }

          # Preserve any Actions-cache keystore aside so Priority 1 (repo file)
          # and Priority 2 (DEBUG_KEYSTORE_BASE64 secret) ALWAYS override stale cache.
          CACHED_KEYSTORE_PATH="./.cached-debug.keystore"
          rm -f "${CACHED_KEYSTORE_PATH}"
          if [ -f "${KEYSTORE_PATH}" ] && [ -s "${KEYSTORE_PATH}" ]; then
            mv "${KEYSTORE_PATH}" "${CACHED_KEYSTORE_PATH}"
          fi

          # Priority 1: debug.keystore.base64 in repository (matches Firebase google-services.json SHA-1!)
          if [ -f "${KEYSTORE_B64_FILE}" ] && [ -s "${KEYSTORE_B64_FILE}" ]; then
            echo "Restoring authoritative signing keystore from ${KEYSTORE_B64_FILE}..."
            tr -d '\r\n ' < "${KEYSTORE_B64_FILE}" | base64 -d > "${KEYSTORE_PATH}" || rm -f "${KEYSTORE_PATH}"
          fi

          # Priority 2: DEBUG_KEYSTORE_BASE64 GitHub Secret (overrides stale cache & orphan branch!)
          if ! is_valid_keystore "${KEYSTORE_PATH}" && [ -n "${SECRET_KEYSTORE_B64}" ]; then
            echo "Restoring persistent signing keystore from DEBUG_KEYSTORE_BASE64 secret..."
            printf '%s' "${SECRET_KEYSTORE_B64}" | tr -d '\r\n ' | base64 -d > "${KEYSTORE_PATH}" || rm -f "${KEYSTORE_PATH}"
          fi

          # Priority 3: Cached debug.keystore (from Actions cache fallback)
          if ! is_valid_keystore "${KEYSTORE_PATH}" && is_valid_keystore "${CACHED_KEYSTORE_PATH}"; then
            echo "Falling back to cached signing keystore from GitHub Actions cache..."
            mv "${CACHED_KEYSTORE_PATH}" "${KEYSTORE_PATH}"
          fi
          rm -f "${CACHED_KEYSTORE_PATH}"

          if is_valid_keystore "${KEYSTORE_PATH}"; then
            echo "Using valid persistent keystore at ${KEYSTORE_PATH}."
          else
            rm -f "${KEYSTORE_PATH}"
          fi

          # Priority 4: Persistent orphan branch 'ci-debug-keystore' in this repo
          if ! is_valid_keystore "${KEYSTORE_PATH}"; then
            echo "Checking persistent orphan branch 'ci-debug-keystore'..."
            if git fetch --no-tags --depth=1 origin refs/heads/ci-debug-keystore:refs/remotes/origin/ci-debug-keystore 2>/dev/null; then
              git show refs/remotes/origin/ci-debug-keystore:ci-debug-keystore.b64 2>/dev/null | tr -d '\r\n ' | base64 -d > "${KEYSTORE_PATH}" || rm -f "${KEYSTORE_PATH}"
            fi
          fi

          # Priority 5: First-time auto-generation (persisted immediately to orphan branch 'ci-debug-keystore' + Actions cache)
          if ! is_valid_keystore "${KEYSTORE_PATH}"; then
            echo "No existing persistent keystore found; generating a persistent debug keystore once..."
            rm -f "${KEYSTORE_PATH}"
            "${KEYTOOL_BIN}" -genkeypair -v \
              -keystore "${KEYSTORE_PATH}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            CREATED_NEW_KEYSTORE="true"
          fi

          if [ "${CREATED_NEW_KEYSTORE}" = "true" ] && [ -n "${GH_TOKEN:-}" ] && [ -n "${GITHUB_REPOSITORY:-}" ]; then
            echo "Saving generated keystore to orphan branch 'ci-debug-keystore' so future updates install in-place..."
            WORK_ROOT="$(pwd)"
            TMP_KS_REPO="$(mktemp -d)"
            (
              cd "${TMP_KS_REPO}"
              git init -q
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              base64 < "${WORK_ROOT}/${KEYSTORE_PATH}" | tr -d '\r\n' > ci-debug-keystore.b64
              git add ci-debug-keystore.b64
              git commit -q -m "chore: persist CI debug signing keystore for in-place APK updates"
              git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
              git push -q origin HEAD:refs/heads/ci-debug-keystore
            ) && echo "Saved persistent keystore to branch 'ci-debug-keystore'." \
              || echo "::warning::Could not push 'ci-debug-keystore' branch; relying on Actions cache for persistence."
            rm -rf "${TMP_KS_REPO}"
          fi

          CERT_INFO="$("${KEYTOOL_BIN}" -list -v -keystore "${KEYSTORE_PATH}" -storepass android -alias androiddebugkey 2>&1)" || {
            echo "::error::Invalid keystore or missing alias 'androiddebugkey' at ${KEYSTORE_PATH}."
            echo "${CERT_INFO}"
            exit 1
          }
          SHA1_FP="$(printf '%s\n' "${CERT_INFO}" | awk '/SHA1:/ { sub(/^[[:space:]]*SHA1:[[:space:]]*/, ""); print; exit }')"
          SHA256_FP="$(printf '%s\n' "${CERT_INFO}" | awk '/SHA256:/ { sub(/^[[:space:]]*SHA256:[[:space:]]*/, ""); print; exit }')"
          echo "Persistent signing keystore verified (SHA1: ${SHA1_FP:-unknown} | SHA256: ${SHA256_FP:-unknown})."
          echo "sha1=${SHA1_FP:-unknown}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${SHA256_FP:-unknown}" >> "${GITHUB_OUTPUT}"

      - name: Ensure Android SDK licenses and platform 36.1
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID SDK_ROOT=${SDK_ROOT}"
          SDKMANAGER=""
          for candidate in \
            "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "${SDK_ROOT}/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "${candidate}" ] && [ -x "${candidate}" ]; then
              SDKMANAGER="${candidate}"
              break
            fi
          done
          if [ -n "${SDKMANAGER}" ]; then
            yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1 || true
            yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "::warning::sdkmanager not found; using pre-installed Android SDK."
          fi

      - name: Restore Firebase google-services.json (optional secret)
        id: firebase_cfg
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_RAW: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ACTIVE_SHA1: ${{ steps.keystore.outputs.sha1 }}
        run: |
          set -euo pipefail
          TARGET="app/google-services.json"
          if [ -f "${TARGET}" ] && [ -s "${TARGET}" ]; then
            echo "Using repository ${TARGET}."
          elif [ -n "${GOOGLE_SERVICES_JSON_B64}" ]; then
            echo "Restoring ${TARGET} from GOOGLE_SERVICES_JSON_BASE64 secret..."
            printf '%s' "${GOOGLE_SERVICES_JSON_B64}" | tr -d '\r\n ' | base64 -d > "${TARGET}"
          elif [ -n "${GOOGLE_SERVICES_JSON_RAW}" ]; then
            echo "Restoring ${TARGET} from GOOGLE_SERVICES_JSON secret..."
            printf '%s\n' "${GOOGLE_SERVICES_JSON_RAW}" > "${TARGET}"
          else
            echo "::warning::${TARGET} not found in repository or GitHub Secrets; building with fallback resource (add GOOGLE_SERVICES_JSON secret to enable Google Sign-In in CI APKs)."
          fi

          SHA1_STATUS="Chưa kiểm tra"
          if [ -f "${TARGET}" ] && [ -s "${TARGET}" ]; then
            ACTIVE_HEX="$(printf '%s' "${ACTIVE_SHA1}" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            REGISTERED_HASHES="$(grep -oE '"certificate_hash"[[:space:]]*:[[:space:]]*"[0-9a-fA-F]+"' "${TARGET}" | sed -E 's/.*"([0-9a-fA-F]+)"/\1/' | tr '[:upper:]' '[:lower:]' || true)"
            if [ -n "${REGISTERED_HASHES}" ]; then
              if printf '%s\n' "${REGISTERED_HASHES}" | grep -qx "${ACTIVE_HEX}"; then
                echo "Google Sign-In SHA-1 check PASSED: APK SHA-1 (${ACTIVE_SHA1}) matches ${TARGET}."
                SHA1_STATUS="Khớp Firebase SHA-1 (Google Sign-In sẵn sàng)"
              else
                echo "::warning::SHA-1 MISMATCH! APK keystore SHA-1 is ${ACTIVE_SHA1}, which is NOT registered in ${TARGET} (${REGISTERED_HASHES}). Add GitHub Secret DEBUG_KEYSTORE_BASE64 (copied from debug.keystore.base64) OR add SHA-1 ${ACTIVE_SHA1} in Firebase Console so Google Sign-In does not fail with [16] Account reauth failed."
                SHA1_STATUS="Lệch SHA-1 Firebase (thêm Secret DEBUG_KEYSTORE_BASE64 hoặc đăng ký SHA-1 ${ACTIVE_SHA1} trên Firebase Console)"
              fi
            fi
          fi
          echo "sha1_status=${SHA1_STATUS}" >> "${GITHUB_OUTPUT}"

      - name: Build debug APK
        shell: bash
        env:
          APP_VERSION_CODE: ${{ needs.determine-version.outputs.version_num }}
          APP_VERSION_NAME: ${{ needs.determine-version.outputs.version_tag }}
          APP_GITHUB_REPO: ${{ github.repository }}
        run: >
          gradle :app:assembleDebug
          -PappVersionCode="${APP_VERSION_CODE}"
          -PappVersionName="${APP_VERSION_NAME}"
          -PappGithubRepo="${APP_GITHUB_REPO}"
          --no-configuration-cache --stacktrace --no-daemon

      - name: Verify & stage APK release asset
        id: prepare_release_asset
        shell: bash
        env:
          VERSION_TAG: ${{ needs.determine-version.outputs.version_tag }}
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "${EXPECTED_APK}" ] || [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK not found or empty at ${EXPECTED_APK}."
            find app/build/outputs/apk -type f -name '*.apk' 2>/dev/null || true
            exit 1
          fi

          apk_size="$(stat -c%s "${EXPECTED_APK}")"
          echo "Verified debug APK: ${EXPECTED_APK} (${apk_size} bytes)"

          ASSET_FILENAME="tool-toan-${VERSION_TAG}.apk"
          RELEASE_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "${RELEASE_DIR}"
          ASSET_PATH="${RELEASE_DIR}/${ASSET_FILENAME}"
          cp "${EXPECTED_APK}" "${ASSET_PATH}"

          echo "Prepared release APK asset: ${ASSET_FILENAME}"
          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_FILENAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tool-toan-${{ needs.determine-version.outputs.version_tag }}-apk
          path: ${{ steps.prepare_release_asset.outputs.asset_path }}
          if-no-files-found: error

  build-ios-ipa:
    name: Build iPhone IPA (iOS 15+ Universal Unsigned)
    needs: determine-version
    runs-on: macos-latest
    outputs:
      asset_name: ${{ steps.package_ipa.outputs.asset_name }}
      ipa_size_mb: ${{ steps.package_ipa.outputs.ipa_size_mb }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Xcode & install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Prepare shared PDF, AppIcon & version metadata for iOS
        shell: bash
        env:
          VERSION_TAG: ${{ needs.determine-version.outputs.version_tag }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 1. Reuse the single 388-page DPAD PDF from Android assets (zero git duplication)
          PDF_SRC="app/src/main/assets/docs/toan_10_11_12_dpad.pdf"
          PDF_DST="ios/Resources/toan_10_11_12_dpad.pdf"
          if [ ! -f "${PDF_SRC}" ] || [ ! -s "${PDF_SRC}" ]; then
            echo "::error::Bundled 388-page PDF missing at ${PDF_SRC}."
            exit 1
          fi
          mkdir -p ios/Resources
          cp "${PDF_SRC}" "${PDF_DST}"
          echo "Bundled PDF copied to ${PDF_DST} ($(stat -f%z "${PDF_DST}") bytes)."

          # 2. Generate universal iOS AppIcon PNGs from Android launcher icon using macOS sips
          ICON_SRC="app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          ICON_DIR="ios/Resources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "${ICON_DIR}"
          if [ -f "${ICON_SRC}" ] && [ -s "${ICON_SRC}" ]; then
            sips -s format png -z 120 120 "${ICON_SRC}" --out "${ICON_DIR}/icon-120.png" >/dev/null
            sips -s format png -z 180 180 "${ICON_SRC}" --out "${ICON_DIR}/icon-180.png" >/dev/null
            sips -s format png -z 152 152 "${ICON_SRC}" --out "${ICON_DIR}/icon-152.png" >/dev/null
            sips -s format png -z 167 167 "${ICON_SRC}" --out "${ICON_DIR}/icon-167.png" >/dev/null
            sips -s format png -z 1024 1024 "${ICON_SRC}" --out "${ICON_DIR}/icon-1024.png" >/dev/null
            echo "Generated all universal iOS AppIcon PNGs from ${ICON_SRC}."
          else
            echo "::warning::Launcher icon missing at ${ICON_SRC}; continuing without custom AppIcon PNGs."
          fi

          # 3. Inject version tag & GitHub repo into ios/Info.plist
          PLIST="ios/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :ToolToanVersionTag ${VERSION_TAG}" "${PLIST}"
          /usr/libexec/PlistBuddy -c "Set :ToolToanGithubRepo ${GITHUB_REPO}" "${PLIST}"
          echo "Injected ToolToanVersionTag=${VERSION_TAG} and ToolToanGithubRepo=${GITHUB_REPO} into ${PLIST}."

      - name: Generate Xcode project & compile unsigned arm64 iOS Release app
        shell: bash
        env:
          VERSION_NUM: ${{ needs.determine-version.outputs.version_num }}
        run: |
          set -euo pipefail
          cd ios
          xcodegen generate --spec project.yml

          xcodebuild \
            -project ToolToan.xcodeproj \
            -scheme ToolToan \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${VERSION_NUM}.0" \
            CURRENT_PROJECT_VERSION="${VERSION_NUM}" \
            build

      - name: Package & verify unsigned universal IPA
        id: package_ipa
        shell: bash
        env:
          VERSION_TAG: ${{ needs.determine-version.outputs.version_tag }}
        run: |
          set -euo pipefail
          APP_BUNDLE="ios/build/Build/Products/Release-iphoneos/ToolToan.app"
          if [ ! -d "${APP_BUNDLE}" ] || [ ! -f "${APP_BUNDLE}/ToolToan" ]; then
            echo "::error::Compiled iOS .app bundle or binary missing at ${APP_BUNDLE}."
            ls -la ios/build/Build/Products/Release-iphoneos || true
            exit 1
          fi

          if [ ! -f "${APP_BUNDLE}/toan_10_11_12_dpad.pdf" ]; then
            echo "::error::Bundled 388-page PDF was not copied into ${APP_BUNDLE}!"
            ls -la "${APP_BUNDLE}"
            exit 1
          fi

          STAGE_DIR="${RUNNER_TEMP}/ipa-stage"
          RELEASE_DIR="${RUNNER_TEMP}/ipa-release-asset"
          rm -rf "${STAGE_DIR}" "${RELEASE_DIR}"
          mkdir -p "${STAGE_DIR}/Payload" "${RELEASE_DIR}"

          cp -R "${APP_BUNDLE}" "${STAGE_DIR}/Payload/ToolToan.app"
          # Strip any residual signatures/profiles so AltStore/Sideloadly/TrollStore/ESign install cleanly
          rm -rf "${STAGE_DIR}/Payload/ToolToan.app/_CodeSignature"
          rm -f "${STAGE_DIR}/Payload/ToolToan.app/embedded.mobileprovision"

          ASSET_FILENAME="tool-toan-${VERSION_TAG}.ipa"
          ASSET_PATH="${RELEASE_DIR}/${ASSET_FILENAME}"

          (
            cd "${STAGE_DIR}"
            zip -qry "${ASSET_PATH}" Payload
          )

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::error::Failed to create non-empty IPA at ${ASSET_PATH}."
            exit 1
          fi

          # Verify key contents inside the packaged .ipa archive
          unzip -l "${ASSET_PATH}" | grep -q "Payload/ToolToan.app/ToolToan"
          unzip -l "${ASSET_PATH}" | grep -q "Payload/ToolToan.app/Info.plist"
          unzip -l "${ASSET_PATH}" | grep -q "Payload/ToolToan.app/toan_10_11_12_dpad.pdf"

          IPA_BYTES="$(stat -f%z "${ASSET_PATH}")"
          IPA_MB="$(awk "BEGIN { printf \"%.1f MB\", ${IPA_BYTES} / 1048576 }")"
          echo "Verified unsigned universal iPhone IPA: ${ASSET_FILENAME} (${IPA_BYTES} bytes / ${IPA_MB})"

          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_FILENAME}" >> "${GITHUB_OUTPUT}"
          echo "ipa_size_mb=${IPA_MB}" >> "${GITHUB_OUTPUT}"

      - name: Upload iPhone IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tool-toan-${{ needs.determine-version.outputs.version_tag }}-ipa
          path: ${{ steps.package_ipa.outputs.asset_path }}
          if-no-files-found: error

  publish-github-release:
    name: Publish Dual-Platform GitHub Release (APK + IPA)
    needs: [determine-version, build-android-apk, build-ios-ipa]
    if: always() && needs.determine-version.result == 'success' && (needs.build-android-apk.result == 'success' || needs.build-ios-ipa.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download Android APK artifact
        if: needs.build-android-apk.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: tool-toan-${{ needs.determine-version.outputs.version_tag }}-apk
          path: ${{ runner.temp }}/release-assets

      - name: Download iPhone IPA artifact
        if: needs.build-ios-ipa.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: tool-toan-${{ needs.determine-version.outputs.version_tag }}-ipa
          path: ${{ runner.temp }}/release-assets

      - name: Create GitHub Release with APK & IPA
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NUM: ${{ needs.determine-version.outputs.version_num }}
          VERSION_TAG: ${{ needs.determine-version.outputs.version_tag }}
          RELEASE_TITLE: ${{ needs.determine-version.outputs.release_title }}
          APK_RESULT: ${{ needs.build-android-apk.result }}
          IPA_RESULT: ${{ needs.build-ios-ipa.result }}
          APK_NAME: ${{ needs.build-android-apk.outputs.asset_name }}
          IPA_NAME: ${{ needs.build-ios-ipa.outputs.asset_name }}
          IPA_SIZE: ${{ needs.build-ios-ipa.outputs.ipa_size_mb }}
          SIGNING_SHA1: ${{ needs.build-android-apk.outputs.sha1 }}
          SIGNING_SHA256: ${{ needs.build-android-apk.outputs.sha256 }}
          FIREBASE_SHA1_STATUS: ${{ needs.build-android-apk.outputs.firebase_sha1_status }}
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi

          ASSETS_DIR="${RUNNER_TEMP}/release-assets"
          ASSET_FILES=()
          if [ -n "${APK_NAME}" ] && [ -s "${ASSETS_DIR}/${APK_NAME}" ]; then
            ASSET_FILES+=("${ASSETS_DIR}/${APK_NAME}")
          fi
          if [ -n "${IPA_NAME}" ] && [ -s "${ASSETS_DIR}/${IPA_NAME}" ]; then
            ASSET_FILES+=("${ASSETS_DIR}/${IPA_NAME}")
          fi

          if [ "${#ASSET_FILES[@]}" -eq 0 ]; then
            echo "::error::No release assets found in ${ASSETS_DIR}."
            ls -la "${ASSETS_DIR}" || true
            exit 1
          fi

          CHANGELOG_SECTION=""
          if [ -f "CHANGELOG.md" ]; then
            CHANGELOG_SECTION="$(awk '
              /^## / {
                if (found) exit
                found = 1
                next
              }
              found { print }
            ' CHANGELOG.md | sed '/./,$!d')"
          fi

          PREV_TAG=""
          if [ "${VERSION_NUM}" -gt 1 ]; then
            PREV_TAG="v$((VERSION_NUM - 1))"
          fi

          COMMIT_LOG=""
          if [ -n "${PREV_TAG}" ] && git rev-parse -q --verify "refs/tags/${PREV_TAG}" >/dev/null 2>&1; then
            COMMIT_LOG="$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:'- %s (`%h`)' -n 20 || true)"
          else
            COMMIT_LOG="$(git log --no-merges --pretty=format:'- %s (`%h`)' -n 10 || true)"
          fi

          RELEASE_NOTES="## 📝 Nhật ký thay đổi (${RELEASE_TITLE})"$'\n\n'
          if [ -n "${CHANGELOG_SECTION}" ]; then
            RELEASE_NOTES+="${CHANGELOG_SECTION}"$'\n\n'
          fi
          if [ -n "${COMMIT_LOG}" ]; then
            RELEASE_NOTES+="### Chi tiết commit cập nhật"$'\n'"${COMMIT_LOG}"$'\n\n'
          fi

          RELEASE_NOTES+="---"$'\n'
          RELEASE_NOTES+="### 📱 Tải xuống & Cài đặt"$'\n'
          if [ "${APK_RESULT}" = "success" ] && [ -n "${APK_NAME}" ]; then
            RELEASE_NOTES+="- **Android (.apk):** \`${APK_NAME}\` — cài trực tiếp trên Android (cập nhật đè không mất dữ liệu)."$'\n'
          fi
          if [ "${IPA_RESULT}" = "success" ] && [ -n "${IPA_NAME}" ]; then
            RELEASE_NOTES+="- **iPhone / iPad (.ipa):** \`${IPA_NAME}\` (${IPA_SIZE}) — bản **không ký sẵn (unsigned), iOS 15.0+, arm64**, đầy đủ 5 tab (3D, 2D, PDF 388 trang, Trợ lý AI streaming, Cài đặt)."$'\n'
            RELEASE_NOTES+="  - Cài trên mọi iPhone bằng **AltStore / SideStore / Sideloadly** (Apple ID miễn phí), **TrollStore**, **ESign** hoặc **Scarlet**."$'\n'
          fi

          RELEASE_NOTES+=$'\n'"### Thông tin bản dựng"$'\n'
          RELEASE_NOTES+="- **Phiên bản ứng dụng:** \`${VERSION_TAG}\` (versionCode: \`${VERSION_NUM}\`)"$'\n'
          if [ "${APK_RESULT}" = "success" ]; then
            RELEASE_NOTES+="- **Android SHA-1 (Google Sign-In / Firebase):** \`${SIGNING_SHA1}\`"$'\n'
            RELEASE_NOTES+="- **Trạng thái Google Sign-In:** ${FIREBASE_SHA1_STATUS}"$'\n'
            RELEASE_NOTES+="- **Android SHA-256 cố định:** \`${SIGNING_SHA256}\`"$'\n'
          fi
          RELEASE_NOTES+="- **Workflow Run:** #${GITHUB_RUN_NUMBER}"$'\n'
          RELEASE_NOTES+="- **Commit SHA:** \`${GITHUB_SHA}\`"$'\n'

          gh release create "${VERSION_TAG}" "${ASSET_FILES[@]}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --latest

          echo "release_tag=${VERSION_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Report dual-platform release summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          APK_RESULT: ${{ needs.build-android-apk.result }}
          IPA_RESULT: ${{ needs.build-ios-ipa.result }}
          APK_NAME: ${{ needs.build-android-apk.outputs.asset_name }}
          IPA_NAME: ${{ needs.build-ios-ipa.outputs.asset_name }}
          VERSION_TAG: ${{ needs.determine-version.outputs.version_tag }}
          RELEASE_TITLE: ${{ needs.determine-version.outputs.release_title }}
        run: |
          set -euo pipefail
          RELEASE_URL=""
          if [ "${PUBLISH_OUTCOME}" = "success" ]; then
            RELEASE_URL="$(gh release view "${VERSION_TAG}" --json url --jq '.url' 2>/dev/null || true)"
          fi

          {
            echo "## ${RELEASE_TITLE} — Kết quả Build & Release (Android APK + iPhone IPA)"
            echo ""
            echo "| Nền tảng | Trạng thái | File phát hành | Artifact dự phòng |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| **Android** | \`${APK_RESULT}\` | \`${APK_NAME:-n/a}\` | \`tool-toan-${VERSION_TAG}-apk\` |"
            echo "| **iPhone (iOS 15+)** | \`${IPA_RESULT}\` | \`${IPA_NAME:-n/a}\` | \`tool-toan-${VERSION_TAG}-ipa\` |"
            echo ""
            if [ -n "${RELEASE_URL}" ]; then
              echo "- **GitHub Release URL:** ${RELEASE_URL}"
            else
              echo "> **Warning:** Không thể tạo hoặc xác minh GitHub Release; các file vẫn có sẵn trong mục Artifacts phía trên."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
